name: installs

# Counts the program's downloads over every release (each install or
# update fetches it once; SHA256SUMS is left out) and keeps the number in
# the "badges" branch for the README's shields.io badge.
on:
  schedule:
    - cron: "17 */6 * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-24.04
    steps:
      - name: Count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq '[.[].assets[] | select(.name | startswith("neotunnel-linux-")) | .download_count] | add // 0' | awk '{s+=$1} END {print s+0}')
          echo "installs: $n"
          mkdir out
          printf '{"schemaVersion":1,"label":"installs","message":"%s","color":"f5a524","labelColor":"111111"}\n' "$n" > out/installs.json
      - name: Publish
        run: |
          cd out
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add installs.json
          git commit -q -m "installs badge"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" badges
