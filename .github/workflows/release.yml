name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X neotunnel/internal/version.Version=${GITHUB_REF_NAME}" \
              -o dist/neotunnel-linux-$arch ./cmd/neotunnel
          done
          (cd dist && sha256sum neotunnel-linux-* > SHA256SUMS && cat SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            # What changed, from docs/releases/<tag>.md when it exists.
            if [ -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
              cat "docs/releases/$GITHUB_REF_NAME.md"
              echo
            fi
            echo "نصب یا به‌روزرسانی روی اوبونتو:"
            echo
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh | sudo bash"
            echo '```'
            echo
            echo 'روی سروری که NeoTunnel دارد: `sudo neotunnel update`'
            echo
            echo "اخبار و نسخه‌های تازه: [کانال تلگرام NeoAurora](https://t.me/neoaurora) · [حمایت از پروژه](https://github.com/${GITHUB_REPOSITORY}#حمایت-مالی)"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "NeoTunnel $GITHUB_REF_NAME" --notes-file notes.md

  # Runs the real one-line install from the published release on a fresh
  # Ubuntu machine with systemd, then checks the service and the panel.
  install-test:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - name: One-line install
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/install.sh" | sudo bash -s -- --version "$GITHUB_REF_NAME" | tee install.log
      - name: Service and panel are up
        run: |
          systemctl is-active --quiet neotunnel
          test "$(neotunnel version)" = "$GITHUB_REF_NAME"
          url=$(grep -o 'https://[^ ]*' install.log | head -1)
          port=$(sed -E 's#https://[^:]+:([0-9]+)/.*#\1#' <<<"$url")
          path=$(sed -E 's#https://[^/]+(/[^/]+)/#\1#' <<<"$url")
          for i in $(seq 20); do curl -sk -o /dev/null "https://127.0.0.1:$port$path/" && break; sleep 1; done
          code=$(curl -sk -o /dev/null -w '%{http_code}' "https://127.0.0.1:$port$path/")
          echo "panel $url -> $code"
          test "$code" = 200
          sudo neotunnel status
      - name: Re-running upgrades and keeps the panel
        run: |
          before=$(sudo neotunnel panel info | grep -o 'https://[^ ]*')
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/install.sh" | sudo bash -s -- --version "$GITHUB_REF_NAME"
          after=$(sudo neotunnel panel info | grep -o 'https://[^ ]*')
          test "$before" = "$after"
